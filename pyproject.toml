[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detective-ai"
version = "0.1.0"
description = "Multi-agent forensic reasoning system for investigative reconstruction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Agent orchestration
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",

    # Database (PostgreSQL + pgvector in production, SQLite fallback locally)
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3.0",

    # MCP tool interface
    "mcp>=1.2.0",

    # ML / Math
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "networkx>=3.2",

    # Utilities
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Real video processing: YOLOv8 detection + MobileNetV2 ReID
cv = [
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "torchvision>=0.18",
]
# Text embeddings for RAG over logs and witness statements
embeddings = [
    "sentence-transformers>=3.0",
]
# Experiment tracking for benchmark runs
tracking = [
    "mlflow>=2.14",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
all = ["detective-ai[cv,embeddings,tracking,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501: long lines in prompts/log strings are acceptable at 100-col target
# UP042: keeping (str, Enum) bases for explicit pydantic v2 compatibility
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true