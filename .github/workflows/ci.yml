name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src benchmarks tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run test suite (SQLite backend, no external services)
        env:
          DATABASE_URL: sqlite:///ci_test.db
          GROQ_API_KEY: ""
        run: pytest tests -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run offline benchmark (10 synthetic scenarios)
        env:
          DATABASE_URL: sqlite:///ci_bench.db
          GROQ_API_KEY: ""
        run: python -m benchmarks.runner --mode offline --count 10 --output benchmark_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t detective-ai:ci .