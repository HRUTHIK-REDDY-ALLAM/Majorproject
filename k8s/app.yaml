apiVersion: apps/v1
kind: Deployment
metadata:
  name: detective-ai
  namespace: detective-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: detective-ai
  template:
    metadata:
      labels:
        app: detective-ai
    spec:
      containers:
        - name: api
          image: detective-ai:latest # replace with your registry image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: detective-ai-config
            - secretRef:
                name: detective-ai-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: detective-ai
  namespace: detective-ai
spec:
  selector:
    app: detective-ai
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: detective-ai
  namespace: detective-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: detective-ai
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70